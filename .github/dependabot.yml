version: 2
updates:
  # GitHub Actions: minors and patches grouped, majors individual
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]

  # npm/pnpm: patches grouped, minors and majors individual
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      npm-patch:
        update-types: ["patch"]
